; Crystal Lamp: Arduino Nano ATmega328P + FastLED + KY-020.

[platformio]
default_envs = nano_atmega328_new

[env:nano_atmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@3.10.3
build_flags =
    -DLED_PIN=6
    -DSHAKE_PIN=2
    -DSHAKE_DEBOUNCE_MS=500
    -DSERIAL_DEBUG=0
    -DSENSOR_DEBUG=0
    -DSENSOR_RAW_DEBUG=0
    -DSENSOR_LIVE_INTERVAL_MS=0
    -DDATA_LINE_TEST=0
    -DDEFAULT_NUM_LEDS=15
    -DMAX_LEDS=150
    -DPOWER_LIMIT_MA=400
    -DLED_TYPE=WS2811
    -DLED_COLOR_ORDER=GRB

[env:nano_atmega328_new]
extends = env:nano_atmega328
board = nanoatmega328new
